name: 'CodSpeed'

on:
  push:
    branches:
      - main
  pull_request:
  # Allows CodSpeed to trigger backtest performance analysis
  # in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  # Required for OpenID Connect authentication with CodSpeed
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips native postinstall scripts (esbuild, sharp,
        # sentry-cli, etc.) that can hang on the CI runner. The benchmarks
        # only exercise pure TypeScript utilities, so none are needed.
        run: npm ci --ignore-scripts

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: npm run bench
